<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>PSGIM One</title>

    <!-- PWA & Mobile Web Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0284C7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PSGIM One" />
    <link rel="apple-touch-icon" href="/assets/icon.png" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />

    <!-- Style resets for React Native Web & Fullscreen PWA -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0F172A;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      .selectable-text,
      .selectable-text * {
        -webkit-user-select: text !important;
        user-select: text !important;
        -webkit-touch-callout: default !important;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      <div style="color: #fff; text-align: center; padding: 2rem; font-family: sans-serif;">
        You need to enable JavaScript to run PSGIM One.
      </div>
    </noscript>
    <div id="root"></div>

    <!-- Register PWA Service Worker (only in production / outside localhost) -->
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          // Unregister any active service worker on localhost so development updates are instant
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
          if (window.caches) {
            caches.keys().then(function (names) {
              for (let name of names) caches.delete(name);
            });
          }
        } else {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js')
              .then(function (registration) {
                console.log('[PWA] Service Worker registered with scope: ', registration.scope);
              })
              .catch(function (error) {
                console.warn('[PWA] Service Worker registration failed: ', error);
              });
          });
        }
      }
    </script>
  </body>
</html>
