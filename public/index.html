<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>PSGIM One</title>

    <!-- PWA & Mobile Web Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0284C7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PSGIM One" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- Style resets for React Native Web & Fullscreen PWA -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0F172A;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      .selectable-text,
      .selectable-text * {
        -webkit-user-select: text !important;
        user-select: text !important;
        -webkit-touch-callout: default !important;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      <div style="color: #fff; text-align: center; padding: 2rem; font-family: sans-serif;">
        You need to enable JavaScript to run PSGIM One.
      </div>
    </noscript>
    <div id="root"></div>

    <!-- Register PWA Service Worker (only in production / outside localhost) -->
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          // Unregister any active service worker on localhost so development updates are instant
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
          if (window.caches) {
            caches.keys().then(function (names) {
              for (let name of names) caches.delete(name);
            });
          }
        } else {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js')
              .then(function (registration) {
                console.log('[PWA] Service Worker registered with scope: ', registration.scope);
              })
              .catch(function (error) {
                console.warn('[PWA] Service Worker registration failed: ', error);
              });
          });
        }
      }
    </script>

    <!-- In-App 'Add to Home Screen' Helper & Banner -->
    <div id="pwa-install-banner" style="display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 99999; width: 90%; max-width: 420px; background: #1E293B; border: 1px solid #0284C7; border-radius: 14px; padding: 12px 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); align-items: center; justify-content: space-between; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <img src="/icon-192.png" style="width: 40px; height: 40px; border-radius: 10px;" alt="Logo" />
        <div>
          <div style="color: #F8FAFC; font-weight: 700; font-size: 14px;">Install PSGIM One</div>
          <div style="color: #94A3B8; font-size: 11px;">Add to Home Screen for offline access</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button id="pwa-install-btn" style="background: #0284C7; color: #FFFFFF; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer;">Install</button>
        <button id="pwa-close-btn" style="background: transparent; color: #94A3B8; border: none; font-size: 16px; cursor: pointer; padding: 4px;">✕</button>
      </div>
    </div>

    <script>
      let deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const banner = document.getElementById('pwa-install-banner');
        if (banner) banner.style.display = 'flex';
      });

      document.getElementById('pwa-install-btn')?.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log('[PWA] User response:', outcome);
          deferredPrompt = null;
          const banner = document.getElementById('pwa-install-banner');
          if (banner) banner.style.display = 'none';
        }
      });

      document.getElementById('pwa-close-btn')?.addEventListener('click', () => {
        const banner = document.getElementById('pwa-install-banner');
        if (banner) banner.style.display = 'none';
      });

      window.addEventListener('appinstalled', () => {
        console.log('[PWA] PSGIM One installed successfully');
        const banner = document.getElementById('pwa-install-banner');
        if (banner) banner.style.display = 'none';
      });
    </script>
  </body>
</html>
